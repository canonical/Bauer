# See https://documentation.ubuntu.com/rockcraft/latest/reference/extensions/go-framework
# For questions or help, visit https://matrix.to/#/#12-factor-charms:ubuntu.com

name: bauer
# see https://documentation.ubuntu.com/rockcraft/latest/explanation/bases/
# for more information about bases and using 'bare' bases for chiselled rocks
base: bare # as an alternative, an ubuntu base can be used
build-base: ubuntu@24.04 # build-base is required when the base is bare
version: '0.1' # just for humans. Semantic versioning is recommended
summary: Automate copy update changes # 79 char long summary
description: |
    Bauer is a Go application that extracts document content, suggestions
    (proposed edits), and comments from Google Docs using the Google Docs
    API and Google Drive API.
# the platforms this rock should be built on and run on.
# you can check your architecture with `dpkg --print-architecture`
platforms:
    # amd64:
    arm64:
    # ppc64el:
    # s390x:

# to ensure the go-framework extension functions properly, your Go project
# should have a go.mod file. Check the parts section for the selection of
# the default binary.
# see https://documentation.ubuntu.com/rockcraft/latest/reference/extensions/go-framework
# for more information.
# +-- my_rock_name
# |   |-- go.mod
# |   |-- migrate.sh

extensions:
    - go-framework

