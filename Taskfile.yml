version: "3"

# Copy .env.example to .env.local and fill in your values before running.
# .env.local is gitignored — never commit secrets.

tasks:
  build:
    desc: Build the Bauer CLI binary
    cmds:
      - go build -o bauer ./cmd/bauer/

  build-api:
    desc: Build the Bauer API server binary
    cmds:
      - go build -o bauer-api ./cmd/app/

  run:
    desc: Run Bauer CLI in standalone mode.
    summary: |
      Requires BAUER_DOC_ID and BAUER_CREDENTIALS_PATH (or --credentials flag).
      Example: task run -- --doc-id 1abc --credentials ./creds.json
    cmds:
      - go run ./cmd/bauer/ {{.CLI_ARGS}}

  run-api:
    desc: Build and start the API server (reads config from .env / .env.local)
    cmds:
      - task: build-api
      - ./bauer-api

  test:
    desc: Run all unit tests
    cmds:
      - go test ./...

  lint:
    desc: Run linter (requires golangci-lint)
    cmds:
      - golangci-lint run ./...

  verify-figma:
    desc: "Verify Figma token and REST API access. Pass FILE_KEY=<your-figma-file-key>."
    cmds:
      - |
        TOKEN="${BAUER_FIGMA_TOKEN:-$FIGMA_TOKEN}"
        if [ -z "$TOKEN" ]; then
          echo "ERROR: set BAUER_FIGMA_TOKEN or FIGMA_TOKEN"
          exit 1
        fi
      - |
        if [ -z "{{.FILE_KEY}}" ]; then
          echo "ERROR: provide FILE_KEY=your-figma-file-key"
          exit 1
        fi
      - |
        curl -sf -H "Authorization: Bearer ${BAUER_FIGMA_TOKEN:-$FIGMA_TOKEN}" \
          "https://api.figma.com/v1/files/{{.FILE_KEY}}/meta" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); print('Name:', d.get('name','?'), '| Last modified:', d.get('lastModified','?'))"

  docker-build:
    desc: Build the Bauer API Docker image
    cmds:
      - docker build -t bauer-api:latest .

  docker-run:
    desc: Run the Bauer API locally in Docker (reads .env.local for secrets)
    cmds:
      - docker run -p 8090:8090
          --env-file .env.local
          -v "${BAUER_CREDENTIALS_PATH}:/creds/service-account.json:ro"
          -e BAUER_CREDENTIALS_PATH=/creds/service-account.json
          bauer-api:latest

  clean:
    desc: Clean up generated files
    cmds:
      - rm -rf bauer-output
      - rm -f bauer bauer-api
      - rm -f bauer.log
      - rm -rf /tmp/gh* /tmp/tmp* /tmp/test-bauer-repo* || true