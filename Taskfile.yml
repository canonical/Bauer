version: "3"
dotenv: [".env.local", ".env"]

tasks:
  build:
    desc: Build the Bauer and Bauer API binaries
    cmds:
      - go build -o bauer-cli cmd/bauer-cli/main.go
      - go build -o bauer-api cmd/bauer-api/main.go

  test:
    desc: Run all tests
    cmds:
      - go test --cover ./...

  fmt:
    desc: Format code using gofmt
    cmds:
      - gofmt -w .

  lint:
    desc: Check code formatting and vet
    cmds:
      - gofmt -l .
      - go vet ./...

  run-server:
    desc: Run the API server locally
    cmds:
      - ./bauer-api

  clean:
    desc: Clean up generated files
    cmds:
      - rm -rf bauer-output
      - rm -f bauer-cli
      - rm -f bauer-api
      - rm -f bauer.log
      - rm -rf /tmp/gh* /tmp/tmp* /tmp/test-bauer-repo* /tmp/bauer-workflow-* || true

  run:
    desc: Clean up generated files, build and run Bauer server
    cmds:
      - task: clean
      - task: build
      - task: run-server
