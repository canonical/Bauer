# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/ for guidance.
# For questions or help, visit https://matrix.to/#/#12-factor-charms:ubuntu.com

name: bauer

type: charm

base: ubuntu@24.04

# the platforms this charm should be built on and run on.
# you can check your architecture with `dpkg --print-architecture`
platforms:
  amd64:

# (Required)
summary: Automate copy update changes

# (Required)
description: |
  Bauer is a Go application that extracts document content, suggestions
  (proposed edits), and comments from Google Docs using the Google Docs
  API and Google Drive API.

extensions:
  - go-framework


config:
  options:
    github-token:
      type: string
      description: GitHub token for authentication
      default: ""
    project-id:
      type: string
      description: Google service account project_id.
      default: ""
    private-key:
      type: string
      description: Google service account private_key.
      default: ""
    client-email:
      type: string
      description: Google service account client_email.
      default: ""
    client-id:
      type: string
      description: Google service account client_id.
      default: ""
